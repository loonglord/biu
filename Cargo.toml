[package]
name = "biu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bb8 = "0.9.1"
config = "0.15.25"
futures-util = "0.3.33"
http-body-util = "0.1.4"
redis = { version = "1.5.0", features = ["bb8", "tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
thiserror = "2.0.20"
tokio = "1.53.1"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
    "compression-full",
    "cors",
    "request-id",
    "trace",
] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
validator = { version = "0.21.0", features = ["derive"] }
